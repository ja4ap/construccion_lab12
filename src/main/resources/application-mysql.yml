# ===============================
# = PARAMETERS
# ===============================

# https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#application-properties.core

# ===============================
# = DATA SOURCE
# ===============================
# Windows
spring:
  datasource :
    url : jdbc:mysql://127.0.0.1:3307/PETCLINIC_DB?useSSL=false&serverTimezone=UTC
    username : tecsup
    password : tecsup

  sql:
    init:
      mode: never
      platform: mysql

  jpa:
    generate-ddl : false
    hibernate.ddl-auto : none
    open-in-view : false
    show-sql : true

  data :
    rest :
      basePath : /api

logging :
  # DEBUG, INFO , ERROR
  level :
    root : INFO

  # Output to a temp_folder/file
  file :
    name : ${user.home}/temp/application.log

server :
  port : 8080
